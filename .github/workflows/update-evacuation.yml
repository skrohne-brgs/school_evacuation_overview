name: Update evacuation overview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: HTML erzeugen
        env:
          WEBUNTIS_SERVER: ${{ secrets.WEBUNTIS_SERVER }}
          WEBUNTIS_SCHOOL: ${{ secrets.WEBUNTIS_SCHOOL }}
          WEBUNTIS_USERNAME: ${{ secrets.WEBUNTIS_USERNAME }}
          WEBUNTIS_PASSWORD: ${{ secrets.WEBUNTIS_PASSWORD }}
        run: |
          python generate_html.py
          test -f docs/index.html

      - name: HTML per WebDAV zu IServ hochladen
        env:
          ISERV_WEBDAV_URL: ${{ secrets.ISERV_WEBDAV_URL }}
          ISERV_WEBDAV_USERNAME: ${{ secrets.ISERV_WEBDAV_USERNAME }}
          ISERV_WEBDAV_PASSWORD: ${{ secrets.ISERV_WEBDAV_PASSWORD }}
        run: |
          curl --fail --silent --show-error \
            --user "$ISERV_WEBDAV_USERNAME:$ISERV_WEBDAV_PASSWORD" \
            --upload-file docs/index.html \
            "$ISERV_WEBDAV_URL"
